name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-build:
    name: Build (Windows) + bench
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
      - name: Build
        run: make -j4 ARCH=-mavx2
      - name: Bench (handcrafted eval)
        run: make bench
      - uses: actions/upload-artifact@v4
        with:
          name: chess-ai-windows
          path: chess-ai.exe

  nnue-inference-test:
    name: NNUE inference vs Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Compile and test
        run: |
          g++ -O2 -std=c++17 -Isrc -o nnue_tools/nnue_test nnue_tools/test_main.cpp src/nnue.cpp
          python nnue_tools/test_nnue.py
